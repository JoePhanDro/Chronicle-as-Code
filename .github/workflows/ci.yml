name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run for the previous commit. Pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests & smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Build stylesheet
        run: npm ci --no-audit --no-fund && npm run build:css

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Render dashboard and check its JavaScript
        run: python scripts/check_dashboard.py "$RUNNER_TEMP/dashboard"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: chronicle-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: API container starts and answers health check
        run: |
          docker run -d --name api-smoke -p 127.0.0.1:8000:8000 \
            -e CHRONICLE_ADMIN_USER=ci-admin -e CHRONICLE_ADMIN_PASSWORD=ci-test-passwort-123 \
            --entrypoint python chronicle-dashboard:ci -m chronicle.serve \
            --db /db/chronicle.db --host 0.0.0.0 --port 8000
          # Docker accepts the connection before the app listens, so the first requests can be reset.
          curl -fsS --retry 30 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/api/v1/health
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/api/v1/topics | grep -qx 401

      - name: Container logs
        if: failure()
        run: docker logs api-smoke || true

      - name: Remove smoke container
        if: always()
        run: docker rm -f api-smoke || true

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Build stylesheet
        run: npm ci --no-audit --no-fund && npm run build:css

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Browser tests
        env:
          CHRONICLE_BROWSER_CHANNEL: chrome
        run: pytest -m browser -q

  proxy:
    name: TLS proxy check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the stack behind the proxy and check it
        env:
          KEEP: 1
        run: ./scripts/check_proxy.sh

      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.proxy.yml logs || true

      - name: Remove the stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.proxy.yml down -v || true
