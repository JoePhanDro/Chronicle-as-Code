name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests & smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Build stylesheet
        run: npm ci --no-audit --no-fund && npm run build:css

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q

      - name: Generate dashboard from sample data
        run: python -m chronicle --data data --out "$RUNNER_TEMP/site"

      - name: Syntax-check dashboard JavaScript
        run: |
          python - "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/dashboard.js" <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding="utf-8").read()
          open(sys.argv[2], "w", encoding="utf-8").write(re.findall(r"<script>(.*?)</script>", html, re.S)[-1])
          PY
          node --check "$RUNNER_TEMP/dashboard.js"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t chronicle-dashboard:ci .

      - name: Run generator in container
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/data:/data:ro" -v "$RUNNER_TEMP/site:/output" \
            chronicle-dashboard:ci --data /data --out /output

      - name: API container starts and answers health check
        run: |
          docker run -d --name api-smoke -p 127.0.0.1:8000:8000 \
            -e CHRONICLE_ADMIN_USER=ci-admin -e CHRONICLE_ADMIN_PASSWORD=ci-test-passwort-123 \
            --entrypoint python chronicle-dashboard:ci -m chronicle.serve \
            --db /db/chronicle.db --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/api/v1/incidents | grep -qx 401
          docker logs api-smoke | tail -5
          docker rm -f api-smoke
