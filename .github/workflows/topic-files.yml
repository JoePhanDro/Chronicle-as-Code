name: Topic files

# Checks the topic files on every push and pull request (ADR 0008, point 5; issue #95).
# Attachments are not in git (ADR 0009), so the check runs with --ohne-anhaenge. The full check, including
# the attachments and their checksums, runs locally with: python -m chronicle check <ordner>

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

jobs:
  check:
    name: chronicle check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The folder with the topic files. Point it at your own data when the content lives in its own repository.
      DATA_DIR: data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install -r requirements.txt

      - name: Check topic files
        run: python -m chronicle check "$DATA_DIR" --ohne-anhaenge
