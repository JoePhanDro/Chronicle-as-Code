{% from "_logo.html" import logo %}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anmeldung · Chronicle</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/static/favicon-48.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="manifest" href="/static/site.webmanifest">
  <script>
    // The theme chosen in the app (or the system setting) applies before sign-in too.
    try {
      const theme = localStorage.getItem('chronicle.theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (error) { /* storage can be blocked; the system setting applies */ }
  </script>
</head>
<body class="min-h-screen bg-slate-950 font-sans text-slate-200 antialiased">
  <main class="grid min-h-screen place-items-center px-4">
    <div class="w-full max-w-sm rounded-2xl border border-white/10 bg-slate-900/60 p-8 shadow-2xl shadow-sky-500/10 backdrop-blur">
      <div class="mb-6 flex items-center gap-3">
        {{ logo('h-10 w-10') }}
        <div>
          <div class="text-[10px] font-semibold uppercase tracking-[.22em] text-sky-300">Chronicle</div>
          <h1 class="text-lg font-semibold text-slate-100">Anmelden</h1>
        </div>
      </div>

      {% if error %}
      <p role="alert" class="mb-4 rounded-lg border border-rose-400/30 bg-rose-500/10 px-3 py-2 text-sm text-rose-200">{{ error }}</p>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-400">Benutzername</span>
          <input name="username" autocomplete="username" required autofocus
                 class="w-full rounded-lg border border-white/10 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-400/60 focus:ring-2 focus:ring-sky-400/20">
        </label>
        <label class="block">
          <span class="mb-1 block text-xs font-medium text-slate-400">Passwort</span>
          <input name="password" type="password" autocomplete="current-password" required
                 class="w-full rounded-lg border border-white/10 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-400/60 focus:ring-2 focus:ring-sky-400/20">
        </label>
        <button type="submit"
                class="w-full rounded-lg bg-gradient-to-r from-sky-400 to-violet-500 px-4 py-2 text-sm font-semibold text-ink transition hover:brightness-110">
          Anmelden
        </button>
      </form>

      {% if lock_enabled %}
      <div class="mt-8 border-t border-white/10 pt-6">
        <h2 class="text-sm font-semibold text-slate-200">Ansicht entsperren</h2>
        <p class="mb-4 mt-1 text-xs text-slate-500">Ohne Konto lesen Sie nach Eingabe des Sperr-Passworts.</p>
        <form method="post" action="/login/entsperren" class="space-y-4">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <label class="block">
            <span class="mb-1 block text-xs font-medium text-slate-400">Sperr-Passwort</span>
            <input name="password" type="password" autocomplete="off" required
                   class="w-full rounded-lg border border-white/10 bg-slate-950/70 px-3 py-2 text-sm text-slate-100 outline-none focus:border-sky-400/60 focus:ring-2 focus:ring-sky-400/20">
          </label>
          <button type="submit"
                  class="w-full rounded-lg border border-white/10 px-4 py-2 text-sm text-slate-200 transition hover:bg-white/5">
            Entsperren
          </button>
        </form>
      </div>
      {% endif %}
    </div>
  </main>
</body>
</html>
