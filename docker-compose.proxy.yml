# Puts the API behind a TLS reverse proxy (Caddy). Use it together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.proxy.yml up -d
# Needs Docker Compose 2.24 or newer (for !reset). See docs/betrieb-tls.md.

services:
  api:
    # The API is reachable only through the proxy now.
    ports: !reset []
    environment:
      # The proxy is the only peer whose X-Forwarded-For counts (chronicle/auth.py).
      CHRONICLE_TRUSTED_PROXIES: 172.30.0.10
      CHRONICLE_COOKIE_SECURE: "1"

  proxy:
    image: caddy:2-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    depends_on:
      api:
        condition: service_healthy
    environment:
      CHRONICLE_HOSTNAME: ${CHRONICLE_HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.0.10
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
