# Chronicle API stack. Setup:
#   cp .env.example .env                                 # set CHRONICLE_ADMIN_USER / _PASSWORD
#   docker compose --profile import run --rm importer    # once per incident, not on every `up`
#   docker compose up -d api                             # then open http://localhost:8000/login

services:
  api:
    build: .
    image: chronicle-dashboard:local
    entrypoint: ["python", "-m", "chronicle.serve"]
    command: ["--db", "/db/chronicle.db", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      CHRONICLE_ADMIN_USER: ${CHRONICLE_ADMIN_USER:-}
      CHRONICLE_ADMIN_PASSWORD: ${CHRONICLE_ADMIN_PASSWORD:-}
      CHRONICLE_DB: /db/chronicle.db
    ports:
      # Localhost only. Put a TLS reverse proxy in front before exposing this anywhere else.
      - "127.0.0.1:8000:8000"
    volumes:
      - chronicle-db:/db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Reads ./data and stores the timeline in the database. Only runs with --profile import.
  importer:
    build: .
    image: chronicle-dashboard:local
    profiles: ["import"]
    entrypoint: ["python", "-m", "chronicle.importer"]
    command: ["--db", "/db/chronicle.db", "--data", "/input"]
    volumes:
      - ./data:/input:ro
      - chronicle-db:/db
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  chronicle-db:
